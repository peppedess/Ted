name: TDLib Android

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prebuilt = zip ufficiale Telegram (~1 min). source = build da sorgente (1-3 h)"
        type: choice
        options: [prebuilt, source]
        default: prebuilt

permissions:
  contents: write

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Prepara output
        run: mkdir -p "$GITHUB_WORKSPACE/out"

      - name: Scarica prebuilt ufficiale
        if: inputs.mode == 'prebuilt'
        run: |
          set -e
          curl -fL --retry 3 -o "$GITHUB_WORKSPACE/out/tdlib.zip" https://core.telegram.org/tdlib/tdlib.zip

      - name: Checkout sorgenti TDLib
        if: inputs.mode == 'source'
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          path: td

      - name: Build da sorgente (Docker)
        if: inputs.mode == 'source'
        working-directory: td/example/android
        run: |
          set -e
          docker build --build-arg TDLIB_INTERFACE=Java --output tdlib .
          find tdlib -maxdepth 2 -name 'tdlib.zip' -exec cp {} "$GITHUB_WORKSPACE/out/" \;
          if [ ! -f "$GITHUB_WORKSPACE/out/tdlib.zip" ]; then
            (cd tdlib && zip -r "$GITHUB_WORKSPACE/out/tdlib.zip" .)
          fi

      - name: Diagnostica
        if: always()
        run: |
          {
            echo "## TDLib — modo: ${{ inputs.mode }}"
            echo ""
            if [ -f "$GITHUB_WORKSPACE/out/tdlib.zip" ]; then
              echo "### Dimensione"
              echo '```'
              ls -lh "$GITHUB_WORKSPACE/out/tdlib.zip"
              echo '```'
              echo "### Librerie native (.so)"
              echo '```'
              unzip -l "$GITHUB_WORKSPACE/out/tdlib.zip" | grep -E '\.so$' || echo "nessuna .so trovata"
              echo '```'
              echo "### Bindings Java"
              echo '```'
              unzip -l "$GITHUB_WORKSPACE/out/tdlib.zip" | grep -E 'TdApi\.java|Client\.java' || echo "nessun binding Java (interfaccia JSON?)"
              echo '```'
            else
              echo "FALLITO: nessun tdlib.zip prodotto."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android
          path: out/tdlib.zip
          retention-days: 90
          if-no-files-found: error
