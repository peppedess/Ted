name: TDLib arm64

on:
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI da compilare (separate da spazio)"
        default: "arm64-v8a"
        type: string

permissions:
  contents: read

concurrency:
  group: tdlib-build
  cancel-in-progress: false

jobs:
  tdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Libera spazio sul runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          path: td

      - name: JDK Temurin 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dipendenze di sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential php-cli perl gperf unzip zip wget curl

      - name: Limita le ABI
        working-directory: td/example/android
        run: |
          set -euo pipefail
          ABIS='${{ inputs.abi }}'
          OLD='for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do'
          NEW="for ABI in $ABIS ; do"
          for f in build-openssl.sh build-tdlib.sh; do
            if ! grep -qF "$OLD" "$f"; then
              echo "::error::Pattern ABI non trovato in $f. Lo script e cambiato a monte."
              exit 1
            fi
            sed -i "s|$OLD|$NEW|" "$f"
          done
          echo "Dopo la patch:"
          grep -n 'for ABI in' build-openssl.sh build-tdlib.sh

      - name: check-environment
        working-directory: td/example/android
        run: ./check-environment.sh

      - name: fetch-sdk
        working-directory: td/example/android
        run: ./fetch-sdk.sh

      - name: build-openssl
        working-directory: td/example/android
        run: ./build-openssl.sh

      - name: build-tdlib
        working-directory: td/example/android
        run: ./build-tdlib.sh

      - name: Diagnostica
        if: always()
        working-directory: td/example/android
        run: |
          {
            echo "## TDLib — ABI: ${{ inputs.abi }}"
            echo ""
            echo "### Spazio disco"
            echo '```'
            df -h / | tail -1
            echo '```'
            if [ -f tdlib/tdlib.zip ]; then
              echo "### Archivio"
              echo '```'
              ls -lh tdlib/tdlib.zip
              echo '```'
              echo "### Librerie native"
              echo '```'
              unzip -l tdlib/tdlib.zip | grep -E '\.so' || echo "nessuna .so"
              echo '```'
              echo "### Bindings Java"
              echo '```'
              unzip -l tdlib/tdlib.zip | grep -E 'TdApi\.java|Client\.java' || echo "nessun binding Java"
              echo '```'
            else
              echo "**Nessun tdlib.zip prodotto.**"
              echo '```'
              ls -la tdlib 2>/dev/null || echo "directory tdlib assente"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: td/example/android/tdlib/tdlib.zip
          retention-days: 90
          if-no-files-found: error
