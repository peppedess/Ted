name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: JDK Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Permessi wrapper
        run: chmod +x gradlew

      - name: Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: ./gradlew :protocol:build :app:assembleDebug :wear:assembleDebug :wear:assembleRelease --stacktrace

      - name: Errori di compilazione
        if: failure()
        run: |
          {
            echo "## Errori"
            echo '```'
            ./gradlew :app:compileDebugKotlin --console=plain 2>&1 \
              | grep "^e: " | sed 's|.*/it/peppedess/ted/||' | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostica
        if: always()
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
        run: |
          {
            echo "## Build"
            echo ""
            echo "| APK | Dimensione |"
            echo "|-----|-----------|"
            find . -name '*.apk' -print0 2>/dev/null | while IFS= read -r -d '' f; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            if [ -n "${TG_API_ID:-}" ]; then
              echo "Credenziali Telegram: presenti"
            else
              echo "Credenziali Telegram: **assenti** (i secret non sono stati letti)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK telefono
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ted-phone-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK orologio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ted-wear-debug
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK orologio (release)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ted-wear-release
          path: wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
